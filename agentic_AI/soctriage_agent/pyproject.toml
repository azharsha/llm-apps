[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soctriage"
version = "1.0.0"
description = "AI-powered Linux kernel / SoC crash diagnostic tool"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SD Move" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.25.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "argparse-manpage>=4.5",
    "shtab>=1.7",
    "pip-audit",
    "types-PyYAML",
]

[project.scripts]
soctriage = "soctriage.cli:main"

[project.urls]
Homepage = "https://github.com/sdmove/soctriage"
Repository = "https://github.com/sdmove/soctriage"
Issues = "https://github.com/sdmove/soctriage/issues"

[tool.hatch.build.targets.wheel]
packages = ["soctriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "smoke: fast smoke test, no fixtures",
    "integration: full pipeline tests",
    "benchmark: performance benchmarks",
    "e2e: end-to-end tests with real fixtures",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["anthropic", "httpx"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
