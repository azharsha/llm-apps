[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soctriage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML",
]

[project.scripts]
soctriage = "soctriage.cli:main"
